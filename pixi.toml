[project]
authors = ["mathias157 <mathiasros@gmail.com>"]
channels = ["conda-forge", "bioconda", "nodefaults"]
name = "template"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
python = ">=3.9"
